name: Publicar invitación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener invitación
        uses: actions/checkout@v7

      - name: Preparar sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v5
